[build-system]
requires = ['setuptools>=77']
build-backend = 'setuptools.build_meta'

[project]
name = 'cellnet'
version = '0.1.5'
description = 'CellNet: panoramic modelling of single-cell transcriptomes at scale'
readme = 'README.md'
requires-python = '>=3.10'
license = 'Apache-2.0'
license-files = ['LICENSE', 'NOTICE']
dependencies = ['torch>=2.3', 'timm==1.0.22', 'numpy>=1.26', 'scipy>=1.11']

[project.urls]
Repository = "https://github.com/daydayup-xq/CellNet"
Issues = "https://github.com/daydayup-xq/CellNet/issues"

[project.optional-dependencies]
pretraining = ['safetensors>=0.4', 'huggingface_hub>=0.34']
h5ad = ['anndata>=0.10']
examples = ['anndata>=0.10', 'h5py>=3.8', 'pandas>=2.0', 'scikit-learn>=1.3', 'scanpy>=1.10', 'scib>=1.1', 'igraph>=0.11', 'leidenalg>=0.10']
visualization = ['matplotlib>=3.8']
projection = ['openTSNE==1.0.4', 'scikit-learn==1.8.0']

[tool.setuptools.packages.find]
include = ['cellnet*']
